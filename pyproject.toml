[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datiao"
version = "0.1.0"
description = "Zhicha Classroom 2.0 R1 process data foundation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]
ml = [
    "lightgbm>=4.0,<5.0",
    "scikit-learn>=1.4,<2.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
